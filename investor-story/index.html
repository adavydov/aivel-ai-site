<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <link rel="stylesheet" href="./style.css?v=20260831-3" />
    <link rel="stylesheet" href="./password-gate.css" />
    <link rel="shortcut icon" href="./favicon.svg" />
    <link rel="icon" href="./favicon.svg" />
    <link
      rel="canonical"
      href="https://adavydov.github.io/aivel-ai-site/investor-story/"
    />
    <title>Закрытая страница Aivel</title>
    <script src="./unlock.js" defer></script>
  </head>
  <body class="locked-page">
    <main class="unlock-shell">
      <section class="unlock-card" aria-labelledby="unlock-title">
        <p class="unlock-kicker">Aivel · закрытые материалы</p>
        <h1 id="unlock-title">Введите пароль</h1>
        <p class="unlock-copy">
          Содержимое страницы зашифровано и расшифровывается только в этом
          браузере.
        </p>
        <form id="unlock-form" class="unlock-form">
          <label for="unlock-password">Пароль доступа</label>
          <div class="unlock-control">
            <input
              id="unlock-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              autofocus
            />
            <button type="submit">Открыть</button>
          </div>
          <p id="unlock-error" class="unlock-error" role="alert" aria-live="polite"></p>
        </form>
        <p class="unlock-note">
          Пароль не отправляется на сервер и не сохраняется на устройстве.
        </p>
      </section>
    </main>
  </body>
</html>
